<h1>Employees</h1>

<button mat-raised-button color="primary" (click)="addEmployee()">Add Employee</button>

<table mat-table [dataSource]="employees">

  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef> Code </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.employeeCode }}
    </td>
  </ng-container>


  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef> First Name </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.firstName }}
    </td>
  </ng-container>


  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.email }}
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let emp">
        <button mat-raised-button color="primary" (click)="editEmployee(emp.id)">Edit</button>
        <button mat-raised-button color="warn" (click)="deactivateEmployee(emp.id)">Deactivate</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
