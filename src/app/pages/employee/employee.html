<div class="top-bar">

  <div class="user-card">
    <div>
      Logged in as: <strong>{{ currentUser.userName }}</strong>
    </div>

    <div class="role-badge">
      {{ currentUser.role }}
    </div>
  </div>

  <input type="text" placeholder="Search employee..." [(ngModel)]="searchText" (input)="searchEmployees()">

</div>

<h1>Employees</h1>

<button mat-raised-button color="primary" (click)="addEmployee()">Add Employee</button>

<table mat-table [dataSource]="employees">

  <ng-container matColumnDef="userName">
    <th mat-header-cell *matHeaderCellDef> User </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.userName }}
    </td>
  </ng-container>


  <ng-container matColumnDef="firstName">
    <th mat-header-cell *matHeaderCellDef> First Name </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.firstName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef> Last Name </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.lastName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.email }}
    </td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef> Phone </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.phone }}
    </td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> Role </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.role }}
    </td>
  </ng-container>

  <ng-container matColumnDef="departmentName">
    <th mat-header-cell *matHeaderCellDef> Department </th>
    <td mat-cell *matCellDef="let emp">
      {{ emp.department.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Action</th>
    <td mat-cell *matCellDef="let emp">
      <button mat-raised-button color="primary" (click)="editEmployee(emp.id)">Edit</button>
      <button mat-raised-button color="warn" (click)="deactivateEmployee(emp.id)">Deactivate</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
