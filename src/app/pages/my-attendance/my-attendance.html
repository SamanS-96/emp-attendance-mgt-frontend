<h1>My-Attendance</h1>

<table mat-table [dataSource]="attendances">

  <ng-container matColumnDef="userName">
    <th mat-header-cell *matHeaderCellDef> Employee </th>
    <td mat-cell *matCellDef="let att">
      {{ att.userName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="attendanceDate">
    <th mat-header-cell *matHeaderCellDef> Date </th>
    <td mat-cell *matCellDef="let att">
      {{ att.attendanceDate}}
    </td>
  </ng-container>

  <ng-container matColumnDef="checkInTime">
    <th mat-header-cell *matHeaderCellDef> Check In </th>
    <td mat-cell *matCellDef="let att">
      {{ att.checkInTime }}
    </td>
  </ng-container>

  <ng-container matColumnDef="checkOutTime">
    <th mat-header-cell *matHeaderCellDef> Check Out </th>
    <td mat-cell *matCellDef="let att">
      {{ att.checkOutTime }}
    </td>
  </ng-container>

  <ng-container matColumnDef="workingHours">
    <th mat-header-cell *matHeaderCellDef> Working Hours </th>
    <td mat-cell *matCellDef="let att">
      {{ att.workingHours }}
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let att">
      {{ att.status }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
