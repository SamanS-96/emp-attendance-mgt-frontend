<div class="top-bar">
  <div class="user-card">
    <div>
      Logged in as: <strong>{{ currentUser.userName }}</strong>
    </div>
    <div class="role-badge">
      {{ currentUser.role }}
    </div>
  </div>

  <input type="text" placeholder="Search leave requests..." [(ngModel)]="searchText" (input)="searchLeaveRequests()">
</div>

<h1>My-Leave Requests</h1>

<button mat-raised-button color="primary" (click)="addLeaveRequest()">Request for Leave</button>

<table mat-table [dataSource]="leaveRequests">

  <ng-container matColumnDef="userName">
    <th mat-header-cell *matHeaderCellDef> Employee </th>
    <td mat-cell *matCellDef="let lr">
      {{ lr.userName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="fromDate">
    <th mat-header-cell *matHeaderCellDef> From Date </th>
    <td mat-cell *matCellDef="let lr">
      {{ lr.fromDate }}
    </td>
  </ng-container>

  <ng-container matColumnDef="toDate">
    <th mat-header-cell *matHeaderCellDef> To Date </th>
    <td mat-cell *matCellDef="let lr">
      {{ lr.toDate }}
    </td>
  </ng-container>

  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef> Reason </th>
    <td mat-cell *matCellDef="let lr">
      {{ lr.reason }}
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let lr">

      @if(lr.status==='PENDING'){
      {{ lr.status }} |<a class="edit-link" (click)="editLeaveRequest(lr.id)">Edit</a>
      }@else{
      {{lr.status}}
      }

      <ng-template #showStatus>
        {{ lr.status }}
      </ng-template>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
