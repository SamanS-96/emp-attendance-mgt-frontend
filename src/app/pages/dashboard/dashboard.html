<div class="dashboard-container">

    <!-- Current User Card -->
    <div class="user-card">

        <div>
            <h2>Welcome, {{currentUser?.userName}}</h2>
            <p>
                Role : {{currentUser?.role}}
            </p>
        </div>

    </div>

    <h1>Dashboard</h1>
    <p>Welcome to Employee Attendance Management System</p>


    <div class="card-container">

        <div class="dashboard-card">
            <h2>Total Employees</h2>
            <h1>120</h1>
        </div>


        <div class="dashboard-card">
            <h2>Present Today</h2>
            <h1>95</h1>
        </div>


        <div class="dashboard-card">
            <h2>Absent Today</h2>
            <h1>8</h1>
        </div>


        <div class="dashboard-card">
            <h2>My Attendance</h2>
            <h1 style="color: #3f51b5; font-size: 25PX;">PRESENT</h1>
        </div>


    </div>

    <div class="action-container">

        <div class="action-card checkin">
            <h2>Check In</h2>
            <p>Start your working day</p>

            <button>
                Check In
            </button>
        </div>


        <div class="action-card checkout">
            <h2>Check Out</h2>
            <p>End your working day</p>

            <button>
                Check Out
            </button>
        </div>

    </div>

</div>
